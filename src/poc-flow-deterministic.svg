<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FABINI AI Operations Agent deterministic mock workflow</title>
  <desc id="desc">A high-level deterministic workflow: the request reaches the host, a fixed mock investigation sequence runs through validated tools, and the result may pause for approval before a simulated action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#236b50"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a85e22"/>
    </marker>
    <style>
      .title { font: 800 29px Inter, Arial, sans-serif; fill: #17211d; }
      .subtitle { font: 16px Inter, Arial, sans-serif; fill: #68736d; }
      .section { font: 800 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #236b50; }
      .box-title { font: 800 16px Inter, Arial, sans-serif; fill: #17211d; }
      .box-text { font: 14px Inter, Arial, sans-serif; fill: #68736d; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #68736d; }
      .node { fill: #fff; stroke: #dfe5df; stroke-width: 2; }
      .green { fill: #f4f8f3; stroke: #b9d9c1; stroke-width: 2; }
      .orange { fill: #fff8ec; stroke: #ead0a9; stroke-width: 2; }
      .blue { fill: #f1f6fb; stroke: #bdd0e2; stroke-width: 2; }
      .lane { fill: #edf4ee; stroke: #c9dccd; stroke-width: 2; stroke-dasharray: 8 8; }
      .line { fill: none; stroke: #236b50; stroke-width: 3; marker-end: url(#arrow); }
      .orange-line { fill: none; stroke: #a85e22; stroke-width: 3; marker-end: url(#orange-arrow); }
      .dashed { fill: none; stroke: #8d9a91; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f5f7f3"/>
  <text x="55" y="55" class="title">FABINI AI Operations Agent · Deterministic Mock</text>
  <text x="55" y="84" class="subtitle">A fixed, reproducible walkthrough: the same request follows the same investigation sequence.</text>

  <rect x="855" y="32" width="290" height="68" rx="14" class="green"/>
  <text x="880" y="59" class="section">MAIN DIFFERENCE</text>
  <text x="880" y="82" class="box-text">Scripted tool order · no model choice</text>

  <text x="55" y="135" class="section">COMMON HOST PATH</text>
  <rect x="55" y="155" width="185" height="92" rx="14" class="node"/>
  <text x="78" y="190" class="box-title">1 · Browser</text>
  <text x="78" y="216" class="box-text">User asks about an order</text>
  <text x="78" y="235" class="small">POST /api/runs</text>

  <rect x="300" y="155" width="220" height="92" rx="14" class="green"/>
  <text x="323" y="190" class="box-title">2 · API + orchestrator</text>
  <text x="323" y="216" class="box-text">Validate, bound, and audit</text>
  <text x="323" y="235" class="small">Host policy applies in every mode</text>

  <rect x="580" y="155" width="240" height="92" rx="14" class="green"/>
  <text x="603" y="190" class="box-title">3 · Mock adapter</text>
  <text x="603" y="216" class="box-text">Loads the scripted walkthrough</text>
  <text x="603" y="235" class="small">Local data, no credentials or network</text>

  <path d="M240 201 H290" class="line"/>
  <path d="M520 201 H570" class="line"/>

  <rect x="55" y="295" width="1090" height="175" rx="18" class="lane"/>
  <text x="80" y="327" class="section">FIXED INVESTIGATION SEQUENCE</text>
  <text x="80" y="354" class="box-text">The mock requests the same read-only evidence in the same order.</text>

  <rect x="80" y="380" width="210" height="62" rx="12" class="blue"/>
  <text x="102" y="407" class="box-title">Order + payment</text>
  <text x="102" y="429" class="small">get_order → get_payment</text>

  <rect x="345" y="380" width="210" height="62" rx="12" class="blue"/>
  <text x="367" y="407" class="box-title">Fulfillment state</text>
  <text x="367" y="429" class="small">get_fulfillment</text>

  <rect x="610" y="380" width="210" height="62" rx="12" class="blue"/>
  <text x="632" y="407" class="box-title">Sync evidence</text>
  <text x="632" y="429" class="small">get_sync_logs</text>

  <rect x="875" y="380" width="210" height="62" rx="12" class="blue"/>
  <text x="897" y="407" class="box-title">Local history</text>
  <text x="897" y="429" class="small">get_order_audit</text>

  <path d="M290 411 H335" class="line"/>
  <path d="M555 411 H600" class="line"/>
  <path d="M820 411 H865" class="line"/>
  <path d="M700 247 V275 H185 V370" class="dashed"/>

  <text x="55" y="520" class="section">RESULT AND OPTIONAL ACTION</text>
  <rect x="55" y="540" width="250" height="100" rx="14" class="green"/>
  <text x="80" y="577" class="box-title">Evidence becomes a diagnosis</text>
  <text x="80" y="604" class="box-text">Findings + structured result</text>
  <text x="80" y="624" class="small">Returned to the browser</text>

  <rect x="365" y="540" width="225" height="100" rx="14" class="orange"/>
  <text x="390" y="577" class="box-title">Action requested?</text>
  <text x="390" y="604" class="box-text">retry_sync or create_ticket</text>
  <text x="390" y="624" class="small">Only on explicit user intent</text>

  <rect x="650" y="540" width="205" height="100" rx="14" class="orange"/>
  <text x="675" y="577" class="box-title">Human approval</text>
  <text x="675" y="604" class="box-text">Approve or reject</text>
  <text x="675" y="624" class="small">No approval, no side effect</text>

  <rect x="915" y="540" width="230" height="100" rx="14" class="green"/>
  <text x="940" y="577" class="box-title">Simulated action + audit</text>
  <text x="940" y="604" class="box-text">Execute once, persist outcome</text>
  <text x="940" y="624" class="small">SQLite records the run</text>

  <path d="M185 470 V530" class="line"/>
  <path d="M305 590 H355" class="line"/>
  <path d="M590 590 H640" class="orange-line"/>
  <path d="M855 590 H905" class="orange-line"/>
  <path d="M365 625 H330 V665 H180 V650" class="dashed"/>
  <text x="345" y="681" class="small">If no action is requested, return the diagnosis directly.</text>
</svg>
