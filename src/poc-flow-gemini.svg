<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FABINI AI Operations Agent Gemini native tool-calling workflow</title>
  <desc id="desc">A high-level Gemini workflow: the model selects tools in a bounded loop, the host validates and executes them, and a final answer or action proposal goes through the same approval and audit controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#236b50"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a85e22"/>
    </marker>
    <style>
      .title { font: 800 29px Inter, Arial, sans-serif; fill: #17211d; }
      .subtitle { font: 16px Inter, Arial, sans-serif; fill: #68736d; }
      .section { font: 800 12px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #236b50; }
      .box-title { font: 800 16px Inter, Arial, sans-serif; fill: #17211d; }
      .box-text { font: 14px Inter, Arial, sans-serif; fill: #68736d; }
      .small { font: 12px Inter, Arial, sans-serif; fill: #68736d; }
      .node { fill: #fff; stroke: #dfe5df; stroke-width: 2; }
      .green { fill: #f4f8f3; stroke: #b9d9c1; stroke-width: 2; }
      .orange { fill: #fff8ec; stroke: #ead0a9; stroke-width: 2; }
      .blue { fill: #f1f6fb; stroke: #bdd0e2; stroke-width: 2; }
      .lane { fill: #edf4ee; stroke: #c9dccd; stroke-width: 2; stroke-dasharray: 8 8; }
      .line { fill: none; stroke: #236b50; stroke-width: 3; marker-end: url(#arrow); }
      .orange-line { fill: none; stroke: #a85e22; stroke-width: 3; marker-end: url(#orange-arrow); }
      .dashed { fill: none; stroke: #8d9a91; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f5f7f3"/>
  <text x="55" y="55" class="title">FABINI AI Operations Agent · Gemini Mode</text>
  <text x="55" y="84" class="subtitle">The model chooses the next tool from the available schemas; the host still controls every execution.</text>

  <rect x="855" y="32" width="290" height="68" rx="14" class="blue"/>
  <text x="880" y="59" class="section">MAIN DIFFERENCE</text>
  <text x="880" y="82" class="box-text">Model-selected tools · adaptive loop</text>

  <text x="55" y="135" class="section">COMMON HOST PATH</text>
  <rect x="55" y="155" width="185" height="92" rx="14" class="node"/>
  <text x="78" y="190" class="box-title">1 · Browser</text>
  <text x="78" y="216" class="box-text">User asks about an order</text>
  <text x="78" y="235" class="small">POST /api/runs</text>

  <rect x="300" y="155" width="220" height="92" rx="14" class="green"/>
  <text x="323" y="190" class="box-title">2 · API + orchestrator</text>
  <text x="323" y="216" class="box-text">Validate, bound, and audit</text>
  <text x="323" y="235" class="small">Host policy applies in every mode</text>

  <rect x="580" y="155" width="240" height="92" rx="14" class="blue"/>
  <text x="603" y="190" class="box-title">3 · Gemini model</text>
  <text x="603" y="216" class="box-text">Reads context and selects a tool</text>
  <text x="603" y="235" class="small">Native function-calling response</text>

  <path d="M240 201 H290" class="line"/>
  <path d="M520 201 H570" class="line"/>

  <rect x="55" y="295" width="1090" height="175" rx="18" class="lane"/>
  <text x="80" y="327" class="section">MODEL-SELECTED TOOL LOOP</text>
  <text x="80" y="354" class="box-text">Gemini can choose a different next step, stop, or propose an action based on returned evidence.</text>

  <rect x="80" y="380" width="245" height="62" rx="12" class="blue"/>
  <text x="102" y="407" class="box-title">Tool call proposal</text>
  <text x="102" y="429" class="small">Any allowed read or action tool</text>

  <rect x="385" y="380" width="245" height="62" rx="12" class="green"/>
  <text x="407" y="407" class="box-title">Host validates + executes</text>
  <text x="407" y="429" class="small">Schema, allow-list, timeout, limits</text>

  <rect x="690" y="380" width="245" height="62" rx="12" class="green"/>
  <text x="712" y="407" class="box-title">Tool result</text>
  <text x="712" y="429" class="small">Structured evidence is recorded</text>

  <rect x="995" y="380" width="120" height="62" rx="12" class="blue"/>
  <text x="1017" y="407" class="box-title">Decide</text>
  <text x="1017" y="429" class="small">Continue or stop</text>

  <path d="M325 411 H375" class="line"/>
  <path d="M630 411 H680" class="line"/>
  <path d="M935 411 H985" class="line"/>
  <path d="M1055 370 V275 H700 V247" class="dashed"/>
  <text x="875" y="267" class="small">send result back to Gemini</text>

  <text x="55" y="520" class="section">RESULT AND OPTIONAL ACTION</text>
  <rect x="55" y="540" width="250" height="100" rx="14" class="green"/>
  <text x="80" y="577" class="box-title">Final model response</text>
  <text x="80" y="604" class="box-text">Diagnosis + findings</text>
  <text x="80" y="624" class="small">Returned as a structured result</text>

  <rect x="365" y="540" width="225" height="100" rx="14" class="orange"/>
  <text x="390" y="577" class="box-title">Action proposal?</text>
  <text x="390" y="604" class="box-text">retry_sync or create_ticket</text>
  <text x="390" y="624" class="small">Host checks explicit user intent</text>

  <rect x="650" y="540" width="205" height="100" rx="14" class="orange"/>
  <text x="675" y="577" class="box-title">Human approval</text>
  <text x="675" y="604" class="box-text">Approve or reject</text>
  <text x="675" y="624" class="small">No approval, no side effect</text>

  <rect x="915" y="540" width="230" height="100" rx="14" class="green"/>
  <text x="940" y="577" class="box-title">Action + audit</text>
  <text x="940" y="604" class="box-text">Execute once, persist outcome</text>
  <text x="940" y="624" class="small">SQLite records the run</text>

  <path d="M185 470 V530" class="line"/>
  <path d="M305 590 H355" class="line"/>
  <path d="M590 590 H640" class="orange-line"/>
  <path d="M855 590 H905" class="orange-line"/>
  <path d="M365 625 H330 V665 H180 V650" class="dashed"/>
  <text x="345" y="681" class="small">If no action is proposed, return the final diagnosis directly.</text>
</svg>
